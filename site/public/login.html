<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <main class="container-login">

        <section class="lado-esquerdo-login">

            <div class="box-login">
                <h1>LOGIN</h1>

                <label>Email</label>
                <input id="inp_email" type="text">

                <label>Senha</label>
                <input id="inp_senha" type="password">

                <button onclick="entrar()">ENTRAR</button>
            </div>

            <p>
                Não possui uma conta?
                <a href="cadastro.html">CADASTRE-SE</a>
            </p>

        </section>

        <section class="lado-direito-login">
            <img src="style\assets\login.svg" alt="camera_cadastro">
        </section>
    </main>

</body>
</html>

<script>
    async function entrar() {
        let email = inp_email.value;
        let senha = inp_senha.value;

        if (email == "" || senha == "") {
            return alert('Preencha todos os campos');
        }

        try {
            const resposta = await fetch('http://localhost:3333/usuarios/autenticar-directon', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    emailServer: email,
                    senhaServer: senha
                })
            });

            if (resposta.ok) {
                alert('Login realizado com sucesso!');
                window.location = "../Perfil.html";
            } else {
                const erro = await resposta.text();
                alert('Erro: ' + erro);
            }
        } catch (e) {
            alert('Erro ao conectar com o servidor');
        }
    }
</script>
