<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    

    <main class="container">

        <section class="lado-esquerdo">
            <img src="style\assets\Direct.on (1).svg" alt="camera_cadastro">
        </section>

        <section class="lado-direito">

            <div class="box-cadastro">
                <h1>CADASTRO</h1>

                <label>Nome</label>
                <input id="inp_nome" type="text">

                <label>Email</label>
                <input id="inp_email" type="email">

                <label>Insira sua senha</label>
                <input id="inp_senha" type="password">

                <label>Confirme sua senha</label>
                <input id="inp_confSenha" type="password">

                <button onclick="cadastrar()">CADASTRAR-SE</button>
            </div>

            <p>
                já possui uma conta?
                <a href="login.html">LOGIN</a>
            </p>

        </section>

    </main>

</body>
</html>
<script>
    async function cadastrar() {
        let nome = inp_nome.value;
        let email = inp_email.value;
        let senha = inp_senha.value;
        let confirmacao = inp_confSenha.value;

        if (nome == "" || email == "" || senha == "" || confirmacao == "") {
            return alert('Preencha todos os campos');
        }
        if (!email.includes('@') || !email.includes('.')) {
            return alert('Email inválido');
        }
        if (senha !== confirmacao) {
            return alert('Senhas não coincidem');
        }

        try {
            const resposta = await fetch('http://localhost:3333/usuarios/cadastrar-directon', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nomeServer: nome,
                    emailServer: email,
                    senhaServer: senha
                })
            });

            if (resposta.ok) {
                alert('Cadastro realizado com sucesso!');
                window.location = "login.html";
            } else {
                const erro = await resposta.text();
                alert('Erro: ' + erro);
            }
        } catch (e) {
            alert('Erro ao conectar com o servidor');
        }
    }
</script>
