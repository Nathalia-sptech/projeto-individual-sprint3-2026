<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style\style.css">
    <title>Perfil</title>
</head>
<body>

    <header>
        <a class="logo" href="index.html">Direct.on</a>
        <nav>
            <span class="saudacao" id="saudacao">Olá!</span>
        </nav>
        <span class="cadLog"><button onclick="sair()">Sair</button></span>
    </header>

    <section class="diretoresPreferidos">
        <span class="favoritos">Seus diretores preferidos:</span>

        <div class="diretoresFav">
            <img src="" alt="">

        </div>
    </section>

    <section class="comentarios">
        <div class="boxComentario">
            <p>seus comentários:</p>
        </div>
    </section>
</body>

<script>
    const usuario = localStorage.getItem('usuarioLogado');
/* criar uma sessaão com os comentários do usuário sobre cada diretor*/
    if (usuario) {
        const dados = JSON.parse(usuario);
        document.getElementById('saudacao').innerText = `Olá, ${dados.usuario.usuario}!`; 
    } else {
        window.location = "login.html";
    }

    function sair() {
    localStorage.removeItem('usuarioLogado');
    window.location = "index.html";
}
</script>
</html>
